[project]
name = "intent-analyzer"
version = "0.1.0"
description = "Intent Analysis Framework for deep AI agents — analyzes Langfuse traces to extract user intents, satisfaction, and skills relevance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "aiofiles>=24.1",
    "numpy>=1.26",
    "langfuse>=2.0",
    "httpx>=0.27",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
analysis = [
    "bertopic>=0.16",
    "plotly>=5.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extraction", "analysis", "config"]

[tool.ruff]
line-length = 100
